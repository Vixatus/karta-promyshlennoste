<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта промышленностей Набережных Челнов</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{
      --bg:#eef3f8; --panel:#ffffff; --panel-soft:#f8fafc; --line:#dbe3ee;
      --text:#1f2937; --blue1:#1f3c88; --blue2:#2952cc; --blue3:#e8eefc;
      --shadow:0 12px 28px rgba(15,23,42,.16);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
    .app{position:relative;width:100%;height:100vh;overflow:hidden}
    #map{width:100%;height:100%;background:#dbe3ee}
    .top-actions{position:absolute;top:14px;right:14px;z-index:1200;pointer-events:none}
    .toggle-btn{pointer-events:auto;border:none;background:linear-gradient(135deg,var(--blue1),var(--blue2));color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
    .sidebar{position:absolute;top:0;right:0;width:430px;max-width:94vw;height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 28px rgba(15,23,42,.14);z-index:1150;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
    .sidebar.open{transform:translateX(0)}
    .sidebar-header{padding:18px 16px 14px;border-bottom:1px solid #e5e7eb;background:linear-gradient(135deg,var(--blue1),var(--blue2));color:#fff}
    .sidebar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .sidebar-header h1{margin:0 0 8px;font-size:22px;line-height:1.2}
    .sidebar-header p{margin:0;font-size:14px;line-height:1.45;opacity:.96}
    .close-btn{width:34px;height:34px;border:none;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:18px;cursor:pointer}
    .controls{padding:14px 16px;border-bottom:1px solid #e5e7eb;background:var(--panel-soft)}
    .search{width:100%;padding:11px 12px;border:1px solid #cfd8e3;border-radius:12px;font-size:14px;outline:none;margin-bottom:10px;background:#fff}
    .search:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(41,82,204,.12)}
    .filter-row{display:flex;flex-wrap:wrap;gap:8px}
    .filter-btn{border:1px solid #cfd8e3;background:#fff;color:#334155;padding:8px 10px;border-radius:999px;font-size:13px;cursor:pointer;transition:.18s ease}
    .filter-btn:hover,.filter-btn.active{background:var(--blue2);color:#fff;border-color:var(--blue2)}
    .factory-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--blue2) #dbe3ee}
    .factory-list::-webkit-scrollbar{width:12px}
    .factory-list::-webkit-scrollbar-track{background:#dbe3ee;border-radius:999px}
    .factory-list::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue2),var(--blue1));border-radius:999px;border:2px solid #dbe3ee}
    .factory-card{border:1px solid #dde5ef;border-radius:18px;background:#fff;padding:12px;cursor:pointer;transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
    .factory-card:hover,.factory-card.active{box-shadow:0 8px 20px rgba(15,23,42,.08);border-color:#7aa2ff;transform:translateY(-1px)}
    .tag{display:inline-block;background:var(--blue3);color:#2242a5;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:bold;margin-bottom:8px}
    .factory-card h3{margin:0 0 6px;font-size:18px;line-height:1.25}
    .factory-meta{font-size:13px;color:#5b6472;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:8px}
    .factory-card p{margin:0;font-size:14px;line-height:1.58;color:#374151}
    .more-text{margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:14px;line-height:1.72;color:#334155}
    .details-btn{display:inline-block;background:var(--blue2);color:#fff;padding:8px 12px;border-radius:10px;font-size:13px;border:none;cursor:pointer;margin-top:10px}
    .hidden{display:none}
    .empty-state{text-align:center;color:#6b7280;padding:30px 20px;font-size:14px;line-height:1.5}
    .map-marker{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;border:3px solid #fff;box-shadow:0 6px 14px rgba(15,23,42,.25)}
    .marker-machinery{background:#2563eb}.marker-food{background:#16a34a}.marker-metal{background:#dc2626}.marker-materials{background:#7c3aed}.marker-energy{background:#ea580c}.marker-chem{background:#0891b2}.marker-electro{background:#0f766e}.marker-build{background:#475569}.marker-other{background:#334155}
    .leaflet-control-attribution{display:none!important}
    .leaflet-control-zoom{box-shadow:0 8px 20px rgba(15,23,42,.14);border-radius:12px!important;overflow:hidden}
    .leaflet-control-zoom a{width:36px;height:36px;line-height:36px;font-size:18px}
    .leaflet-top.leaflet-right{top:64px;right:14px;z-index:1100}
    .leaflet-popup-content{margin:12px;width:340px!important}
    .popup-card h3{margin:0 0 8px;font-size:18px}
    .popup-info{font-size:13px;color:#4b5563;margin-bottom:8px;line-height:1.55}
    .popup-text{font-size:14px;color:#1f2937;line-height:1.7;margin-bottom:0}
    @media (max-width:760px){.sidebar{width:100%;max-width:none}}
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>
    <div class="top-actions">
      <button id="toggleSidebar" class="toggle-btn" type="button">Список</button>
    </div>
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-top">
          <div>
            <h1>Список предприятий</h1>
            <p>В этой версии карта и список исправлены. Описания можно разворачивать и сворачивать.</p>
          </div>
          <button id="closeSidebar" class="close-btn" type="button">×</button>
        </div>
      </div>
      <div class="controls">
        <input id="searchInput" class="search" type="text" placeholder="Поиск предприятия..." />
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">Все</button>
          <button class="filter-btn" data-filter="Машиностроение">Машиностроение</button>
          <button class="filter-btn" data-filter="Пищевая">Пищевая</button>
          <button class="filter-btn" data-filter="Металлургия">Металлургия</button>
          <button class="filter-btn" data-filter="Материалы">Материалы</button>
          <button class="filter-btn" data-filter="Энергетика">Энергетика</button>
          <button class="filter-btn" data-filter="Химия">Химия</button>
          <button class="filter-btn" data-filter="Электротехника">Электротехника</button>
          <button class="filter-btn" data-filter="Строительство">Строительство</button>
        </div>
      </div>
      <div id="factoryList" class="factory-list"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const factories = [
      { id: 1, expanded: false, name: 'ПАО «КАМАЗ»', owner: 'ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7473, 52.4466], year: '1969', address: 'Автозаводский проспект, 2', products: 'грузовые автомобили, шасси, спецтехника, комплектующие', text: 'Крупнейший производитель тяжёлых грузовых автомобилей и главное промышленное предприятие города. На карте оно помогает лучше понять промышленный профиль города.', more: 'КАМАЗ определяет промышленный профиль Набережных Челнов. С развитием предприятия связаны рост промышленной зоны, появление многочисленных смежных производств и формирование города как одного из важнейших индустриальных центров России. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 2, expanded: false, name: 'Литейный завод КАМАЗ', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7628, 52.4495], year: '1975', address: 'промышленная зона КАМАЗ', products: 'отливки из чугуна и цветных металлов', text: 'Крупная площадка, выпускающая литые заготовки и детали для автомобильной промышленности. На карте оно помогает лучше понять промышленный профиль города.', more: 'Литейный завод является важным звеном полного технологического цикла КАМАЗа. Именно здесь создаются литые детали, которые затем используются на других предприятиях автомобильного комплекса. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 3, expanded: false, name: 'Кузнечный завод КАМАЗ', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7559, 52.4387], year: '1977', address: 'промышленная зона КАМАЗ', products: 'поковки, штампованные детали', text: 'Предприятие тяжёлого машиностроения, выпускающее поковки и штампованные детали. На карте оно помогает лучше понять промышленный профиль города.', more: 'На кузнечном заводе производятся высокопрочные заготовки для силовых элементов автомобилей. Это один из примеров глубокой обработки металла внутри промышленной структуры города. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 4, expanded: false, name: 'Прессово-рамный завод КАМАЗ', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7521, 52.4318], year: '1978', address: 'промышленная зона КАМАЗ', products: 'рамы, штампованные детали, элементы конструкции', text: 'Завод по выпуску рам и крупных элементов конструкции автомобилей КАМАЗ. На карте оно помогает лучше понять промышленный профиль города.', more: 'Именно здесь формируются ключевые силовые элементы будущих грузовиков. Предприятие хорошо показывает масштаб машиностроительного производства в Набережных Челнах. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 5, expanded: false, name: 'Автомобильный завод КАМАЗ', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7444, 52.4248], year: '1976', address: 'промышленная зона КАМАЗ', products: 'грузовые автомобили, шасси', text: 'Одна из главных площадок города, где осуществляется сборка грузовых автомобилей. На карте оно помогает лучше понять промышленный профиль города.', more: 'Автомобильный завод — одно из самых узнаваемых предприятий Набережных Челнов. Он играет важную роль в экономике города и формирует его промышленный имидж. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 6, expanded: false, name: 'Завод двигателей КАМАЗ', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7385, 52.4199], year: '1979', address: 'промышленная зона КАМАЗ', products: 'двигатели, силовые агрегаты', text: 'Площадка по выпуску силовых агрегатов для грузовых автомобилей и специальной техники. На карте оно помогает лучше понять промышленный профиль города.', more: 'Производство двигателей требует высокой точности механической обработки, контроля качества и использования сложного оборудования. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 7, expanded: false, name: 'АО «Ремдизель»', owner: 'АО «Ремдизель»', category: 'Машиностроение', coords: [55.7348, 52.4288], year: '1978', address: 'промышленная зона', products: 'специальная техника, ремонт и модернизация машин', text: 'Крупное машиностроительное предприятие, связанное с ремонтом и выпуском специальной техники. На карте оно помогает лучше понять промышленный профиль города.', more: 'Ремдизель показывает развитие инженерного и специализированного машиностроения в Набережных Челнах. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 8, expanded: false, name: 'Корпорация Haier', owner: 'Haier Smart Home / Haier Russia', category: 'Машиностроение', coords: [55.7326, 52.5106], year: '2016', address: 'ул. Корпорация Хайер, 130', products: 'холодильники, стиральные машины, телевизоры, бытовая техника', text: 'Современный индустриальный комплекс по выпуску бытовой техники. На карте оно помогает лучше понять промышленный профиль города.', more: 'Появление площадки Haier стало важным этапом обновления промышленного профиля города. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 9, expanded: false, name: 'ООО «АвтоЗапчасть КАМАЗ»', owner: 'в группе ПАО «КАМАЗ»', category: 'Машиностроение', coords: [55.7448, 52.4282], year: 'современное предприятие', address: 'Набережные Челны', products: 'запасные части и двигатели', text: 'Предприятие, связанное с обеспечением техники КАМАЗ запасными частями и комплектующими. На карте оно помогает лучше понять промышленный профиль города.', more: 'Это направление важно для всей системы обслуживания и эксплуатации автомобилей КАМАЗ. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 10, expanded: false, name: 'ООО «Сиэнэйч Индастриал Руссия»', owner: 'CNH Industrial', category: 'Машиностроение', coords: [55.7187, 52.4075], year: 'современное предприятие', address: 'Набережные Челны', products: 'сельскохозяйственная техника', text: 'Предприятие международной группы, связанное с производством техники для аграрной сферы. На карте оно помогает лучше понять промышленный профиль города.', more: 'Этот объект расширяет карту города за пределы чисто автомобильной специализации. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 11, expanded: false, name: 'ООО «Технотрон»', owner: 'ООО «Технотрон»', category: 'Машиностроение', coords: [55.7314, 52.4452], year: '1990-е', address: 'Набережные Челны', products: 'автокомпоненты и промышленная продукция', text: 'Производитель автокомпонентов и промышленной продукции. На карте оно помогает лучше понять промышленный профиль города.', more: 'Такие предприятия особенно важны для промышленного города, потому что обеспечивают крупные площадки деталями и узлами. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 12, expanded: false, name: 'АО «ПТФК ЗТЭО»', owner: 'АО «ПТФК ЗТЭО»', category: 'Электротехника', coords: [55.7273, 52.4417], year: '1976', address: 'Набережные Челны', products: 'транспортное электрооборудование', text: 'Предприятие транспортного электрооборудования, выпускающее электротехническую продукцию. На карте оно помогает лучше понять промышленный профиль города.', more: 'Это важный пример узкоспециализированного производства для машиностроительного кластера города. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },
      { id: 13, expanded: false, name: 'ООО «Электрояр»', owner: 'ООО «Электрояр»', category: 'Электротехника', coords: [55.7284, 52.4449], year: '2010', address: 'Набережные Челны', products: 'электротехническая продукция и оборудование', text: 'Предприятие электротехнической промышленности. На карте оно помогает лучше понять промышленный профиль города.', more: 'Такие компании показывают развитие электротехнического направления в городе. Это предприятие важно для промышленной структуры Набережных Челнов, потому что показывает роль своей отрасли в экономике города, связь с другими производствами и значение для занятости населения.' },

      markerZoomAnimation: true,
      preferCanvas: true,
      inertia: true
    }).setView([55.735, 52.41], 11);

    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '' }).addTo(map);

    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const factoryList = document.getElementById('factoryList');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.filter-btn');

    let currentFilter = 'all';
    let currentSearch = '';
    let activeId = null;
    const markers = {};

    function openSidebar() {
      sidebar.classList.add('open');
      setTimeout(() => map.invalidateSize(false), 150);
    }

    function closeSidebarPanel() {
      sidebar.classList.remove('open');
      setTimeout(() => map.invalidateSize(false), 150);
    }

    toggleSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      setTimeout(() => map.invalidateSize(false), 150);
    });

    closeSidebar.addEventListener('click', closeSidebarPanel);

    function getMarkerConfig(category) {
      const configs = {
        'Машиностроение': { emoji: '🚛', className: 'marker-machinery' },
        'Пищевая': { emoji: '🍞', className: 'marker-food' },
        'Металлургия': { emoji: '⚙️', className: 'marker-metal' },
        'Материалы': { emoji: '🧱', className: 'marker-materials' },
        'Энергетика': { emoji: '⚡', className: 'marker-energy' },
        'Химия': { emoji: '🧪', className: 'marker-chem' },
        'Электротехника': { emoji: '🔌', className: 'marker-electro' },
        'Строительство': { emoji: '🏗️', className: 'marker-build' }
      };
      return configs[category] || { emoji: '🏭', className: 'marker-other' };
    }

    function createFactoryIcon(factory) {
      const cfg = getMarkerConfig(factory.category);
      return L.divIcon({
        className: '',
        html: `<div class="map-marker ${cfg.className}" title="${factory.name}">${cfg.emoji}</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17],
        popupAnchor: [0, -12]
      });
    }

    function createPopup(factory) {
      const moreHtml = factory.more
        ? `<div class="more-text ${factory.expanded ? '' : 'hidden'}">${factory.more}</div><button class="details-btn" type="button" data-id="${factory.id}" data-kind="popup">${factory.expanded ? 'Свернуть' : 'Подробнее'}</button>`
        : '';

      return `<div class="popup-card">
        <h3>${factory.name}</h3>
        <div class="popup-info">
          <strong>Отрасль:</strong> ${factory.category}<br>
          <strong>Год создания:</strong> ${factory.year}<br>
          <strong>Владелец:</strong> ${factory.owner || 'не указан'}<br>
          <strong>Что производят:</strong> ${factory.products || 'нет данных'}<br>
          <strong>Адрес:</strong> ${factory.address}
        </div>
        <div class="popup-text">${factory.text}</div>
        ${moreHtml}
      </div>`;
    }

    function getFilteredFactories() {
      const search = currentSearch.toLowerCase();
      return factories.filter(factory => {
        const matchFilter = currentFilter === 'all' || factory.category === currentFilter;
        const matchSearch = factory.name.toLowerCase().includes(search);
        return matchFilter && matchSearch;
      });
    }

    function focusFactory(factory) {
      if (!factory || !markers[factory.id]) return;
      activeId = factory.id;
      map.setView(factory.coords, 13, { animate: true });
      markers[factory.id].openPopup();
      openSidebar();
      renderFactoryList();
    }

    function renderFactoryList() {
      const filtered = getFilteredFactories();
      if (!filtered.length) {
        factoryList.innerHTML = '<div class="empty-state">Ничего не найдено. Попробуй изменить поиск или выбрать другой фильтр.</div>';
        return;
      }

      factoryList.innerHTML = filtered.map(factory => {
        const moreHtml = factory.more
          ? `<div class="more-text ${factory.expanded ? '' : 'hidden'}">${factory.more}</div><button class="details-btn" type="button" data-id="${factory.id}" data-kind="card">${factory.expanded ? 'Свернуть' : 'Подробнее'}</button>`
          : '';

        return `<article class="factory-card ${activeId === factory.id ? 'active' : ''}" data-id="${factory.id}">
          <span class="tag">${factory.category}</span>
          <h3>${factory.name}</h3>
          <div class="factory-meta">
            <span>Год: ${factory.year}</span>
            <span>Владелец: ${factory.owner || 'не указан'}</span>
          </div>
          <div class="factory-meta">
            <span>Что производят: ${factory.products || 'нет данных'}</span>
          </div>
          <p>${factory.text}</p>
          ${moreHtml}
        </article>`;
      }).join('');
    }

    function attachPopupButton(factory) {
      const marker = markers[factory.id];
      if (!marker) return;
      const popup = marker.getPopup();
      if (!popup) return;
      const popupElement = popup.getElement();
      if (!popupElement) return;
      const button = popupElement.querySelector('[data-kind="popup"]');
      if (!button) return;
      button.onclick = (event) => {
        event.preventDefault();
        event.stopPropagation();
        factory.expanded = !factory.expanded;
        marker.setPopupContent(createPopup(factory));
        marker.openPopup();
        renderFactoryList();
      };
    }

    factoryList.addEventListener('click', (event) => {
      const card = event.target.closest('.factory-card');
      if (!card) return;
      const id = Number(card.dataset.id);
      const factory = factories.find(item => item.id === id);
      const button = event.target.closest('[data-kind="card"]');

      if (button && factory) {
        event.preventDefault();
        event.stopPropagation();
        factory.expanded = !factory.expanded;
        renderFactoryList();
        if (activeId === factory.id && markers[factory.id]) {
          markers[factory.id].setPopupContent(createPopup(factory));
          markers[factory.id].openPopup();
        }
        return;
      }

      focusFactory(factory);
    });

    factories.forEach(factory => {
      const marker = L.marker(factory.coords, { icon: createFactoryIcon(factory) })
        .addTo(map)
        .bindPopup(createPopup(factory), { autoPan: true, closeButton: true });

      marker.on('click', () => {
        activeId = factory.id;
        renderFactoryList();
      });

      marker.on('popupopen', () => attachPopupButton(factory));
      markers[factory.id] = marker;
    });

    searchInput.addEventListener('input', (e) => {
      currentSearch = e.target.value.trim();
      renderFactoryList();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(item => item.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderFactoryList();
      });
    });

    factoryList.addEventListener('wheel', (event) => event.stopPropagation(), { passive: true });
    factoryList.addEventListener('touchmove', (event) => event.stopPropagation(), { passive: true });
    window.addEventListener('load', () => setTimeout(() => map.invalidateSize(false), 150));
    window.addEventListener('resize', () => setTimeout(() => map.invalidateSize(false), 100));

    renderFactoryList();
  </script>
</body>
</html>
